[project]
name = "ev-charge"
version = "0.1.0"
description = "Record and report the charging sessions of your EV cars — FastAPI + SQLite"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "openpyxl>=3.1.5",
]

[project.scripts]
ev-charge = "ev_charge.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.28.0",
    "ruff>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ev_charge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 180
target-version = "py312"
exclude = ["src/ev_charge/migrations/versions", "src/ev_charge/static"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP"]
