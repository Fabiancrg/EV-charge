{# Shared filter bar (sessions and reports). The page script reads it with EV.readFilters(). #}
<div class="filters" id="filters">
    <div class="field"><label>{{ t("Car") }}</label><select id="f-car"><option value="">{{ t("All cars") }}</option></select></div>
    <div class="field"><label>{{ t("Period") }}</label>
        <select id="f-preset">
            <option value="all">{{ t("All time") }}</option>
            <option value="this-month">{{ t("This month") }}</option>
            <option value="last-month">{{ t("Last month") }}</option>
            <option value="this-quarter">{{ t("This quarter") }}</option>
            <option value="last-quarter">{{ t("Last quarter") }}</option>
            <option value="last-3">{{ t("Last 3 months") }}</option>
            <option value="last-12">{{ t("Last 12 months") }}</option>
            <option value="this-year">{{ t("This year") }}</option>
            <option value="last-year">{{ t("Last year") }}</option>
            <option value="custom">{{ t("Custom…") }}</option>
        </select>
    </div>
    <div class="field"><label>{{ t("From") }}</label><input type="date" id="f-from"></div>
    <div class="field"><label>{{ t("To") }}</label><input type="date" id="f-to"></div>
    {% if with_reimburse %}
    <div class="field"><label>{{ t("Reimbursement") }}</label>
        <select id="f-reimb"><option value="">{{ t("All") }}</option><option value="true">{{ t("To reimburse") }}</option><option value="false">{{ t("Not to reimburse") }}</option></select>
    </div>
    {% endif %}
    {% if with_status %}
    <div class="field"><label>{{ t("Status") }}</label>
        <select id="f-status"><option value="">{{ t("All statuses") }}</option><option value="outstanding">{{ t("Not paid yet") }}</option>
            <option value="in_progress">⏳ {{ t("In progress") }}</option><option value="not_recorded">⚠ {{ t("Not recorded") }}</option><option value="recorded">✓ {{ t("Recorded") }}</option>
            <option value="invoiced">🧾 {{ t("Invoiced") }}</option><option value="paid">💰 {{ t("Paid") }}</option></select>
    </div>
    {% endif %}
    {% if with_charger %}
    <div class="field"><label>{{ t("Charger") }}</label><select id="f-charger"><option value="">{{ t("All chargers") }}</option></select></div>
    {% endif %}
    {% if with_company %}
    <div class="field"><label>{{ t("Reimbursed by") }}</label><select id="f-company"><option value="__all__">{{ t("All") }}</option></select></div>
    {% endif %}
    {% if with_reimburse %}
    <div class="field grow"><label>{{ t("Search") }}</label><input type="search" id="f-q" placeholder="{{ t("Location, provider, notes…") }}"></div>
    {% endif %}
</div>
<script>
(() => {
    const EV = window.EV = window.EV || {};
    const iso = (d) => new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    function presetRange(p) {
        const now = new Date(), y = now.getFullYear(), m = now.getMonth();
        switch (p) {
            case 'this-month': return [iso(new Date(y, m, 1)), iso(new Date(y, m + 1, 0))];
            case 'last-month': return [iso(new Date(y, m - 1, 1)), iso(new Date(y, m, 0))];
            case 'this-quarter': { const q = Math.floor(m / 3) * 3; return [iso(new Date(y, q, 1)), iso(new Date(y, q + 3, 0))]; }
            case 'last-quarter': { const q = Math.floor(m / 3) * 3 - 3; return [iso(new Date(y, q, 1)), iso(new Date(y, q + 3, 0))]; }
            case 'last-3': return [iso(new Date(y, m - 2, 1)), iso(new Date(y, m + 1, 0))];
            case 'last-12': return [iso(new Date(y, m - 11, 1)), iso(new Date(y, m + 1, 0))];
            case 'this-year': return [`${y}-01-01`, `${y}-12-31`];
            case 'last-year': return [`${y - 1}-01-01`, `${y - 1}-12-31`];
            case 'all': return ['', ''];
            default: return null;
        }
    }
    const $ = (id) => document.getElementById(id);
    EV.readFilters = () => {
        const p = new URLSearchParams();
        // One car, or a group: "@active" (the current cars) / "@inactive" (the former and future ones) send their cars
        const car = $('f-car').value;
        if (car.startsWith('@')) (EV.cars || []).filter(c => c.active === (car === '@active')).forEach(c => p.append('car_id', c.id));
        else if (car) p.append('car_id', car);
        if ($('f-from').value) p.set('date_from', $('f-from').value);
        if ($('f-to').value) p.set('date_to', $('f-to').value);
        if ($('f-reimb')?.value) p.set('to_reimburse', $('f-reimb').value);
        const st = $('f-status')?.value;
        if (st === 'outstanding') ['in_progress', 'not_recorded', 'recorded', 'invoiced'].forEach(x => p.append('status', x));
        else if (st) p.append('status', st);
        if ($('f-charger')?.value) p.append('charger_id', $('f-charger').value);
        const co = $('f-company')?.value;
        if (co !== undefined && co !== '__all__') p.set('company', co === '__none__' ? '' : co);
        if ($('f-q')?.value.trim()) p.set('q', $('f-q').value.trim());
        return p;
    };
    // Filters live in the URL so a filtered view can be bookmarked / reloaded
    EV.initFilters = async (onChange, defaultPreset = 'all') => {
        const cars = EV.cars || await EV.loadCars();
        const mixed = cars.some(c => c.active) && cars.some(c => !c.active);
        $('f-car').innerHTML = `<option value="">${mixed ? EV.t('All cars (active and inactive)') : EV.t('All cars')}</option>`
            + (mixed ? `<option value="@active">${EV.t('Active cars')}</option><option value="@inactive">${EV.t('Inactive cars')}</option>` : '') + EV.activeOptions(cars);
        const u = new URLSearchParams(location.search);
        const wanted = u.getAll('car_id').sort().join(',');
        const group = (on) => cars.filter(c => c.active === on).map(c => String(c.id)).sort().join(',');
        $('f-car').value = !wanted.includes(',') ? wanted : wanted === group(true) ? '@active' : wanted === group(false) ? '@inactive' : '';
        if (u.has('date_from') || u.has('date_to')) {
            $('f-from').value = u.get('date_from') || ''; $('f-to').value = u.get('date_to') || '';
            const match = [...$('f-preset').options].find(o => { const r = presetRange(o.value); return r && r[0] === $('f-from').value && r[1] === $('f-to').value; });
            $('f-preset').value = match ? match.value : 'custom';
        } else {
            $('f-preset').value = ['car_id', 'q', 'to_reimburse', 'status', 'charger_id', 'company'].some(k => u.has(k)) ? 'all' : defaultPreset;
            [$('f-from').value, $('f-to').value] = presetRange($('f-preset').value);
        }
        if ($('f-reimb')) $('f-reimb').value = u.get('to_reimburse') || '';
        if ($('f-status')) {
            const sts = u.getAll('status');
            $('f-status').value = sts.length === 4 && !sts.includes('paid') ? 'outstanding' : (sts[0] || '');
        }
        if ($('f-charger') || $('f-company')) {
            const chargers = EV.chargers || await EV.loadChargers();
            if ($('f-charger')) {
                $('f-charger').innerHTML = `<option value="">${EV.t('All chargers')}</option><option value="0">${EV.t('No charger')}</option>` + EV.activeOptions(chargers, c => `🔌 ${EV.esc(c.name)}`);
                $('f-charger').value = u.get('charger_id') || '';
            }
            if ($('f-company')) {
                const companies = [...new Set(chargers.map(c => c.reimbursement_company).filter(Boolean))].sort();
                $('f-company').innerHTML = `<option value="__all__">${EV.t('All')}</option>` + companies.map(c => `<option value="${EV.esc(c)}">${EV.esc(c)}</option>`).join('') + `<option value="__none__">${EV.t('No charger')}</option>`;
                $('f-company').value = !u.has('company') ? '__all__' : (u.get('company') === '' ? '__none__' : u.get('company'));
                if (!$('f-company').value) $('f-company').value = '__all__';
            }
        }
        if ($('f-q')) $('f-q').value = u.get('q') || '';
        const changed = () => { history.replaceState(null, '', `${location.pathname}?${EV.readFilters()}`); onChange(); };
        $('f-preset').addEventListener('change', () => {
            const r = presetRange($('f-preset').value);
            if (r) { [$('f-from').value, $('f-to').value] = r; changed(); }
        });
        [$('f-from'), $('f-to')].forEach(el => el.addEventListener('change', () => { $('f-preset').value = 'custom'; changed(); }));
        [$('f-car'), $('f-reimb'), $('f-status'), $('f-charger'), $('f-company')].forEach(el => el && el.addEventListener('change', changed));
        let t; $('f-q')?.addEventListener('input', () => { clearTimeout(t); t = setTimeout(changed, 250); });
    };
})();
</script>
