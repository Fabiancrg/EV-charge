{# Language choice of the public pages (sign-in, request, invitation): remembered by the browser #}
<div style="position:fixed;top:12px;right:12px">
    <select id="lang-pick" aria-label="Language" style="width:auto;padding:4px 8px;font-size:var(--font-sm)">
        {% for code, name in languages.items() %}<option value="{{ code }}" {{ 'selected' if code == lang }}>{{ name }}</option>{% endfor %}
    </select>
</div>
<script src="/i18n/{{ lang }}.js?v={{ i18n_version }}"></script>
<script>
window.T = (text, values) => { let out = (window.EV.T || {})[text] ?? text; for (const [k, v] of Object.entries(values || {})) out = out.split(`{${k}}`).join(v); return out; };
document.getElementById('lang-pick').addEventListener('change', async (e) => {
    await fetch('/api/auth/language', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ language: e.target.value }) });
    location.reload();
});
</script>
