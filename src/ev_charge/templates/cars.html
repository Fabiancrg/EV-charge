{% extends "base.html" %}
{% block title %}Cars · EV Charge{% endblock %}
{% block content %}
<div class="content">
    <div class="page-head">
        <h2>Cars</h2>
        {% if user.is_admin %}<button class="btn" id="add-car">＋ Add a car</button>{% endif %}
    </div>
    <div class="table-wrap" id="cars-table"><p class="muted">Loading…</p></div>
</div>

<div class="modal" id="car-modal">
    <div class="modal-box">
        <h3><span id="cf-title">Car</span><button class="icon-btn" data-close title="Close">✕</button></h3>
        <div class="form-error"></div>
        <form id="car-form" autocomplete="off">
            <fieldset><legend>Identity</legend>
                <div class="form-grid">
                    <div class="field span-2"><label>Name *</label><input type="text" name="name" required maxlength="100" placeholder="e.g. Company Model Y" autofocus></div>
                    <div class="field"><label>Make</label><input type="text" name="make" placeholder="Tesla, Kia, BMW…"></div>
                    <div class="field"><label>Model</label><input type="text" name="model"></div>
                    <div class="field"><label>Year</label><input type="number" name="year" min="1990" max="2100"></div>
                    <div class="field"><label>License plate</label><input type="text" name="license_plate"></div>
                    <div class="field"><label>VIN</label><input type="text" name="vin" maxlength="30"></div>
                    <div class="field"><label>Colour</label><input type="text" name="color"></div>
                </div>
            </fieldset>
            <fieldset><legend>Specs</legend>
                <div class="form-grid">
                    <div class="field"><label>Usable battery (kWh)</label><input type="number" name="battery_kwh" step="0.1" min="0"></div>
                    <div class="field"><label>Max AC charging (kW)</label><input type="number" name="max_ac_kw" step="0.1" min="0"></div>
                    <div class="field"><label>Max DC charging (kW)</label><input type="number" name="max_dc_kw" step="1" min="0"></div>
                    <div class="field"><label>WLTP range (km)</label><input type="number" name="wltp_range_km" step="1" min="0"></div>
                    <div class="field"><label>WLTP consumption (kWh/100 km)</label><input type="number" name="wltp_consumption" step="0.1" min="0"></div>
                </div>
            </fieldset>
            <fieldset><legend>Leasing</legend>
                <div class="form-grid">
                    <div class="field"><label>Leasing company</label><input type="text" name="lease_company"></div>
                    <div class="field"><label>Contract number</label><input type="text" name="lease_contract"></div>
                    <div class="field"><label>Start date</label><input type="date" name="lease_start"></div>
                    <div class="field"><label>End date</label><input type="date" name="lease_end"></div>
                    <div class="field"><label>Allowed km / year</label><input type="number" name="lease_km_per_year" step="1" min="0"></div>
                    <div class="field"><label>Monthly cost ({{ currency }})</label><input type="number" name="lease_monthly_cost" step="0.01" min="0"></div>
                    <div class="field"><label>Odometer at start (km)</label><input type="number" name="initial_odometer" step="1" min="0"><div class="hint">Lease mileage counts from here</div></div>
                </div>
            </fieldset>
            <div class="form-grid">
                <div class="field span-all"><label>Notes</label><textarea name="notes" rows="2"></textarea></div>
                <div class="field span-all"><label class="check"><input type="checkbox" name="active" checked> Active (shown on the dashboard and in the session form)</label></div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-danger left" id="cf-delete">🗑 Delete</button>
                <button type="button" class="btn btn-ghost" data-close>Cancel</button>
                <button type="submit" class="btn">💾 Save</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
(() => {
    const form = document.getElementById('car-form');
    let cars = [];
    let editing = null;

    function open(car) {
        editing = car;
        document.getElementById('cf-title').textContent = car ? `Edit ${car.name}` : 'New car';
        document.getElementById('cf-delete').style.display = car && EV.isAdmin() ? '' : 'none';
        form.reset();
        if (car) EV.fillForm(form, car); else form.active.checked = true;
        // Drivers see their cars read-only
        form.querySelectorAll('input, select, textarea').forEach(el => { el.disabled = !EV.isAdmin(); });
        form.querySelector('button[type=submit]').style.display = EV.isAdmin() ? '' : 'none';
        if (!EV.isAdmin()) document.getElementById('cf-title').textContent = car.name;
        EV.openModal('car-modal');
    }

    function render() {
        const box = document.getElementById('cars-table');
        if (!cars.length) {
            box.innerHTML = EV.isAdmin() ? '<div class="empty-state"><h3>No car yet</h3><p>Add your first car with ＋ Add a car.</p></div>'
                : '<div class="empty-state"><h3>No car assigned to you</h3><p>Ask an administrator to assign your car(s) to you.</p></div>';
            return;
        }
        box.innerHTML = `<table><thead><tr><th>Name</th><th>Car</th><th class="hide-sm">Plate</th><th class="num hide-sm">Battery</th><th class="hide-sm">Lease</th><th class="num">Odometer</th><th class="num hide-sm">Sessions</th><th class="hide-sm">Drivers</th><th>Status</th><th></th></tr></thead><tbody>
            ${cars.map(c => `<tr>
                <td><strong>${EV.carDot(c.id)}${EV.esc(c.name)}</strong></td>
                <td>${EV.esc([c.make, c.model, c.year].filter(Boolean).join(' '))}</td>
                <td class="hide-sm">${EV.esc(c.license_plate || '')}</td>
                <td class="num hide-sm">${c.battery_kwh ? EV.num(c.battery_kwh, 1) + ' kWh' : '—'}</td>
                <td class="hide-sm">${c.lease_start ? `${EV.date(c.lease_start)} → ${EV.date(c.lease_end)}${c.lease_km_per_year ? `<br><span class="muted small">${EV.km(c.lease_km_per_year)}/year${c.lease_company ? ' · ' + EV.esc(c.lease_company) : ''}</span>` : ''}` : '—'}</td>
                <td class="num">${EV.km(c.last_odometer)}</td>
                <td class="num hide-sm">${EV.num(c.session_count)}</td>
                <td class="hide-sm small">${c.drivers.map(EV.esc).join('<br>') || '<span class="muted">—</span>'}</td>
                <td>${c.active ? '<span class="badge badge-ok">Active</span>' : '<span class="badge badge-warn">Inactive</span>'}</td>
                <td>${EV.isAdmin() ? `<button class="btn btn-ghost btn-sm" data-edit="${c.id}">✏ Edit</button>` : `<button class="btn btn-ghost btn-sm" data-edit="${c.id}">👁 View</button>`}</td>
            </tr>`).join('')}</tbody></table>`;
    }

    async function load() {
        try { cars = await EV.loadCars(); render(); } catch (err) { EV.toast(err.message, true); }
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
            const body = EV.formData(form);
            const saved = editing ? await EV.api('PUT', `/api/cars/${editing.id}`, body) : await EV.api('POST', '/api/cars', body);
            EV.toast(`${saved.name} saved`);
            EV.closeModal('car-modal');
            load();
        } catch (err) { EV.formError('car-modal', err); }
    });
    document.getElementById('cf-delete').addEventListener('click', async () => {
        if (!editing || !confirm(`Delete ${editing.name}?`)) return;
        try { await EV.api('DELETE', `/api/cars/${editing.id}`); EV.toast('Car deleted'); EV.closeModal('car-modal'); load(); }
        catch (err) { EV.formError('car-modal', err); }
    });
    document.getElementById('add-car')?.addEventListener('click', () => open(null));
    document.getElementById('cars-table').addEventListener('click', (e) => {
        const b = e.target.closest('[data-edit]');
        if (b) open(cars.find(c => c.id === Number(b.dataset.edit)));
    });
    document.addEventListener('ev:themechange', render);
    load().then(() => { if (EV.isAdmin() && new URLSearchParams(location.search).has('new')) open(null); });
})();
</script>
{% endblock %}
